services:
  db:
    image: postgres:16-alpine
    container_name: taxflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taxflow
      POSTGRES_USER: taxflow
      POSTGRES_PASSWORD: taxflow_password
    ports:
      - "5432:5432"
    volumes:
      - taxflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxflow -d taxflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: taxflow_backend
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taxflow_frontend
    restart: unless-stopped
    environment:
      # Server-side (Vite proxy inside Docker network) → use Docker service name
      - VITE_API_BASE_URL=http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  taxflow_pgdata:
